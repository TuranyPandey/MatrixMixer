[package]
name = "matrix-bridge"
version = "0.2.1"
description = "Your Phone (3)'s Glyph Matrix, powered by your PC"
edition = "2021"
license = "MIT"

[lib]
name = "matrix_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-websocket = "2"
# One copy at a time (a second launch just brings the window up), and "Start with Windows".
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Windows notifications, for things that end while you are looking elsewhere (the timer).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust helpers. Versions are pinned to APIs this code was checked against.
mdns-sd = "0.11"
tiny_http = "0.12"
sysinfo = "0.30"
rand = "0.8"
base64 = "0.22"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# Now playing (media session) and the sound level meter. Same version Tauri already brings in.
windows = { version = "0.62", features = ["Media_Control", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
